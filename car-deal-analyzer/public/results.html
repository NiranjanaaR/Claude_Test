<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BilDeal — Analyseresultater</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-content">
      <h1>BilDeal — Resultater</h1>
      <p class="subtitle" id="subtitle">Analyserer annonser fra FINN.no...</p>
    </div>
  </header>
  <main>
    <div id="result-filters" class="result-filters">
      <h3>Filtrer resultater</h3>
      <div class="result-filter-grid">
        <div class="filter-group">
          <label for="filter-ranking">Vurdering</label>
          <select id="filter-ranking">
            <option value="">Alle</option>
            <option value="good">Godt Kjøp</option>
            <option value="risky">Risikabelt</option>
            <option value="avoid">Unngå</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-min-profit">Min. fortjeneste (kr)</label>
          <input type="number" id="filter-min-profit" placeholder="f.eks. 10000">
        </div>
        <div class="filter-group">
          <label for="filter-max-risk">Maks risikoscore</label>
          <input type="number" id="filter-max-risk" placeholder="0-100" min="0" max="100">
        </div>
        <div class="filter-group">
          <label for="filter-sort">Sorter etter</label>
          <select id="filter-sort">
            <option value="ranking">Vurdering</option>
            <option value="profit-desc">Høyest fortjeneste</option>
            <option value="price-asc">Lavest pris</option>
            <option value="risk-asc">Lavest risiko</option>
          </select>
        </div>
      </div>
    </div>

    <section id="summary" class="summary">
      <div class="summary-card good">
        <span class="summary-count" id="count-good">0</span>
        <span class="summary-label">Godt Kjøp</span>
      </div>
      <div class="summary-card risky">
        <span class="summary-count" id="count-risky">0</span>
        <span class="summary-label">Risikabelt</span>
      </div>
      <div class="summary-card avoid">
        <span class="summary-count" id="count-avoid">0</span>
        <span class="summary-label">Unngå</span>
      </div>
      <div class="summary-card total">
        <span class="summary-count" id="count-total">0</span>
        <span class="summary-label">Totalt</span>
      </div>
    </section>

    <section id="results" class="results"></section>

    <div style="text-align:center;margin-top:2rem">
      <a href="/" class="btn btn-secondary">Tilbake til hovedsiden</a>
    </div>
  </main>
  <footer>
    <p>BilDeal — Estimater er veiledende og basert på markedsdata.</p>
  </footer>
  <script>
    var LISTINGS = window.__BILDEAL_DATA__ || [];

    document.addEventListener('DOMContentLoaded', function() {
      var allListings = LISTINGS;
      document.getElementById('subtitle').textContent =
        allListings.length + ' annonser analysert fra FINN.no';

      updateSummary(allListings);
      renderCards(allListings);

      ['filter-ranking','filter-min-profit','filter-max-risk','filter-sort'].forEach(function(id) {
        document.getElementById(id).addEventListener('input', applyFilters);
      });

      function applyFilters() {
        var ranking = document.getElementById('filter-ranking').value;
        var minProfit = parseInt(document.getElementById('filter-min-profit').value) || -Infinity;
        var maxRisk = parseInt(document.getElementById('filter-max-risk').value);
        var sort = document.getElementById('filter-sort').value;

        var filtered = allListings.filter(function(l) {
          if (ranking && l.ranking !== ranking) return false;
          if (l.estimatedProfit < minProfit) return false;
          if (!isNaN(maxRisk) && l.dealScore < (10 - maxRisk/10)) return false;
          return true;
        });

        if (sort === 'profit-desc') filtered.sort(function(a,b) { return b.estimatedProfit - a.estimatedProfit; });
        else if (sort === 'price-asc') filtered.sort(function(a,b) { return a.price - b.price; });
        else if (sort === 'risk-asc') filtered.sort(function(a,b) { return b.dealScore - a.dealScore; });

        updateSummary(filtered);
        renderCards(filtered);
      }
    });

    function updateSummary(listings) {
      document.getElementById('count-good').textContent = listings.filter(function(l){return l.ranking==='good'}).length;
      document.getElementById('count-risky').textContent = listings.filter(function(l){return l.ranking==='risky'}).length;
      document.getElementById('count-avoid').textContent = listings.filter(function(l){return l.ranking==='avoid'}).length;
      document.getElementById('count-total').textContent = listings.length;
    }

    function renderCards(listings) {
      var el = document.getElementById('results');
      if (listings.length === 0) {
        el.innerHTML = '<div class="no-results" style="grid-column:1/-1"><h3>Ingen resultater</h3><p>Prøv å justere filtrene.</p></div>';
        return;
      }
      el.innerHTML = listings.map(function(l, i) { return buildCard(l, i); }).join('');
    }

    function buildCard(l, idx) {
      var labels = {good:'Godt Kjøp',risky:'Risikabelt',avoid:'Unngå'};
      var specs = [];
      if (l.year) specs.push(l.year);
      if (l.mileage) specs.push(formatNum(l.mileage)+' km');
      if (l.fuel) specs.push(l.fuel);
      if (l.transmission) specs.push(l.transmission);

      var profitClass = l.estimatedProfit >= 0 ? 'profit' : 'loss';
      var linkHtml = l.link
        ? '<a href="'+esc(l.link)+'" target="_blank" rel="noopener">Se på FINN.no &rarr;</a>'
        : '';

      // Deal score display
      var ds = l.dealScore || 5;
      var scoreColor = ds >= 7 ? 'var(--good)' : ds >= 5 ? 'var(--risky)' : 'var(--avoid)';
      var dealScoreHtml = '<div style="text-align:center;padding:0.6rem;margin-bottom:1rem;background:var(--bg);border-radius:8px">'
        +'<div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-light);font-weight:600">Deal Score</div>'
        +'<div style="font-size:2rem;font-weight:800;color:'+scoreColor+'">'+ds.toFixed(1)+'</div>'
        +'<div style="font-size:0.75rem;color:var(--text-light)">/10</div></div>';

      // Description analysis
      var descHtml = '';
      var da = l.descriptionAnalysis;
      if (da) {
        var flagsHtml = '';
        if (da.positiveFlags && da.positiveFlags.length > 0) {
          flagsHtml += da.positiveFlags.map(function(f){return '<span style="font-size:0.72rem;padding:0.15rem 0.5rem;border-radius:3px;background:var(--good-bg);color:var(--good);font-weight:500;display:inline-block;margin:0.15rem">'+esc(f)+'</span>'}).join('');
        }
        if (da.negativeFlags && da.negativeFlags.length > 0) {
          flagsHtml += da.negativeFlags.map(function(f){return '<span class="risk-flag" style="display:inline-block;margin:0.15rem">'+esc(f)+'</span>'}).join('');
        }
        if (da.summary) {
          descHtml = '<div style="font-size:0.82rem;padding:0.6rem;background:linear-gradient(135deg,#f0f9ff,#eff6ff);border-radius:6px;margin-bottom:0.75rem;border:1px solid #bfdbfe;line-height:1.5">'
            +'<strong style="color:var(--primary)">Analyse:</strong> '+esc(da.summary)+'</div>';
        }
        if (flagsHtml) {
          descHtml += '<div style="display:flex;flex-wrap:wrap;gap:0.15rem;margin-bottom:0.75rem">'+flagsHtml+'</div>';
        }
      }

      var repairHtml = (da && da.negativeFlags && da.negativeFlags.length > 0 && l.estimatedRepairCost > 0)
        ? '<div class="repair-estimate">Estimert reparasjon: <strong>'+formatKr(l.estimatedRepairCost)+'</strong></div>'
        : '';

      return '<div class="car-card ranking-'+l.ranking+'">'
        +'<div class="card-header"><div class="card-title">'+esc(l.title)+'</div><span class="badge badge-'+l.ranking+'">'+labels[l.ranking]+'</span></div>'
        +'<div class="card-body">'
        +'<div class="card-specs">'+specs.map(function(s){return '<span class="spec-tag">'+esc(s+'')+'</span>'}).join('')+'</div>'
        +dealScoreHtml
        +'<div class="price-grid">'
        +'<div class="price-item asking"><div class="price-label">Prisantydning</div><div class="price-value">'+formatKr(l.price)+'</div></div>'
        +'<div class="price-item market"><div class="price-label">Markedsverdi</div><div class="price-value">'+formatKr(l.marketValue)+'</div></div>'
        +'<div class="price-item '+profitClass+'"><div class="price-label">Est. fortjeneste</div><div class="price-value">'+(l.estimatedProfit>=0?'+':'')+formatKr(l.estimatedProfit)+'</div></div>'
        +'<div class="price-item"><div class="price-label">Fortjeneste-spenn</div><div class="price-value" style="font-size:0.85rem">'+formatKr(l.profitRange.min)+' til '+formatKr(l.profitRange.max)+'</div></div>'
        +'</div>'
        +descHtml+repairHtml+'</div>'
        +'<div class="card-footer">'
        +linkHtml
        +'<div class="ai-dropdown" style="position:relative;display:inline-block">'
        +'<button onclick="toggleAiMenu(this)" style="background:linear-gradient(135deg,#7c3aed,#a855f7);color:white;border:none;padding:6px 14px;border-radius:6px;font-size:0.8rem;font-weight:600;cursor:pointer">Spør AI</button>'
        +'<div class="ai-menu" style="display:none;position:absolute;bottom:100%;right:0;margin-bottom:6px;background:white;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,0.15);border:1px solid #e2e8f0;overflow:hidden;min-width:180px;z-index:10">'
        +'<button onclick="askAI(\'chatgpt\','+idx+')" style="display:block;width:100%;text-align:left;padding:10px 14px;border:none;background:none;cursor:pointer;font-size:0.85rem;border-bottom:1px solid #f1f5f9">ChatGPT</button>'
        +'<button onclick="askAI(\'claude\','+idx+')" style="display:block;width:100%;text-align:left;padding:10px 14px;border:none;background:none;cursor:pointer;font-size:0.85rem;border-bottom:1px solid #f1f5f9">Claude</button>'
        +'<button onclick="askAI(\'gemini\','+idx+')" style="display:block;width:100%;text-align:left;padding:10px 14px;border:none;background:none;cursor:pointer;font-size:0.85rem;border-bottom:1px solid #f1f5f9">Gemini</button>'
        +'<button onclick="askAI(\'copy\','+idx+')" style="display:block;width:100%;text-align:left;padding:10px 14px;border:none;background:none;cursor:pointer;font-size:0.85rem;color:var(--text-light)">Kopier prompt</button>'
        +'</div></div>'
        +(l.location?'<span class="location">'+esc(l.location)+'</span>':'')
        +'</div></div>';
    }

    function toggleAiMenu(btn) {
      var menu = btn.nextElementSibling;
      var allMenus = document.querySelectorAll('.ai-menu');
      allMenus.forEach(function(m) { if (m !== menu) m.style.display = 'none'; });
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.ai-dropdown')) {
        document.querySelectorAll('.ai-menu').forEach(function(m) { m.style.display = 'none'; });
      }
    });

    function buildAiPrompt(listing) {
      var parts = [
        'Jeg vurderer å kjøpe denne bruktbilen for videresalg. Analyser den grundig.\n',
        'BIL: ' + listing.title,
        'PRIS: ' + formatKr(listing.price),
        'ÅRSMODELL: ' + (listing.year || 'Ukjent'),
        'KILOMETERSTAND: ' + (listing.mileage ? formatNum(listing.mileage) + ' km' : 'Ukjent'),
        'DRIVSTOFF: ' + (listing.fuel || 'Ukjent'),
        'GIRKASSE: ' + (listing.transmission || 'Ukjent'),
      ];
      if (listing.link) {
        parts.push('FINN.no LENKE: ' + listing.link);
      }
      if (listing.description) {
        parts.push('\nBESKRIVELSE FRA ANNONSEN:\n"' + listing.description + '"');
      }
      parts.push('\nVÅR AUTOMATISKE ANALYSE:');
      parts.push('- Estimert markedsverdi: ' + formatKr(listing.marketValue));
      parts.push('- Deal Score: ' + (listing.dealScore || 'N/A') + '/10');
      parts.push('- Estimert fortjeneste ved videresalg: ' + formatKr(listing.estimatedProfit));
      if (listing.descriptionAnalysis) {
        if (listing.descriptionAnalysis.positiveFlags && listing.descriptionAnalysis.positiveFlags.length > 0)
          parts.push('- Positive signaler: ' + listing.descriptionAnalysis.positiveFlags.join(', '));
        if (listing.descriptionAnalysis.negativeFlags && listing.descriptionAnalysis.negativeFlags.length > 0)
          parts.push('- Negative signaler: ' + listing.descriptionAnalysis.negativeFlags.join(', '));
      }
      parts.push('\nJeg ønsker å kjøpe denne bilen billig og selge den videre med fortjeneste.');
      parts.push('Vennligst gi meg:');
      parts.push('1. Er denne bilen egnet for videresalg? Hva er realistisk fortjenestepotensial?');
      parts.push('2. Hva er de kjente svakhetene/problemene med denne modellen og årgangen?');
      parts.push('3. Hva bør jeg se etter og teste ved visning for å avdekke skjulte problemer?');
      parts.push('4. Hva er realistisk videresalgspris etter eventuell oppussing/reparasjon?');
      parts.push('5. Konklusjon: Bør jeg kjøpe denne for videresalg, prute prisen ned, eller gå videre?');
      return parts.join('\n');
    }

    function askAI(service, idx) {
      var listing = LISTINGS[idx];
      if (!listing) return;
      var prompt = buildAiPrompt(listing);

      var urls = {
        chatgpt: 'https://chatgpt.com/',
        claude: 'https://claude.ai/new',
        gemini: 'https://gemini.google.com/app',
      };

      // Show modal with prompt preview
      showPromptModal(prompt, service, urls[service]);
      document.querySelectorAll('.ai-menu').forEach(function(m) { m.style.display = 'none'; });
    }

    function showPromptModal(prompt, service, url) {
      var existing = document.getElementById('bildeal-modal');
      if (existing) existing.remove();

      var serviceNames = { chatgpt: 'ChatGPT', claude: 'Claude', gemini: 'Gemini', copy: '' };
      var serviceName = serviceNames[service] || '';

      var modal = document.createElement('div');
      modal.id = 'bildeal-modal';
      modal.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);padding:1rem';

      modal.innerHTML = '<div style="background:white;border-radius:12px;max-width:640px;width:100%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.3)">'
        +'<div style="padding:1.25rem 1.5rem;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center">'
        +'<h3 style="margin:0;font-size:1.1rem">'+(service==='copy'?'Prompt klar til kopiering':'Denne teksten sendes til '+serviceName)+'</h3>'
        +'<button onclick="document.getElementById(\'bildeal-modal\').remove()" style="border:none;background:none;font-size:1.5rem;cursor:pointer;color:#94a3b8;line-height:1">&times;</button>'
        +'</div>'
        +'<div style="padding:1rem 1.5rem;overflow-y:auto;flex:1">'
        +'<pre style="white-space:pre-wrap;word-wrap:break-word;font-size:0.82rem;line-height:1.6;background:#f8fafc;padding:1rem;border-radius:8px;border:1px solid #e2e8f0;margin:0;font-family:-apple-system,sans-serif">'+esc(prompt)+'</pre>'
        +'</div>'
        +'<div style="padding:1rem 1.5rem;border-top:1px solid #e2e8f0;display:flex;gap:0.75rem;justify-content:flex-end">'
        +'<button onclick="document.getElementById(\'bildeal-modal\').remove()" style="padding:8px 16px;border:1px solid #e2e8f0;background:white;border-radius:6px;cursor:pointer;font-size:0.9rem">Avbryt</button>'
        +'<button id="bildeal-copy-send" style="padding:8px 20px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:white;border:none;border-radius:6px;cursor:pointer;font-size:0.9rem;font-weight:600">'
        +(service==='copy'?'Kopier tekst':'Kopier og åpne '+serviceName)+'</button>'
        +'</div></div>';

      document.body.appendChild(modal);

      modal.addEventListener('click', function(e) {
        if (e.target === modal) modal.remove();
      });

      document.getElementById('bildeal-copy-send').addEventListener('click', function() {
        navigator.clipboard.writeText(prompt).then(function() {
          if (service !== 'copy' && url) window.open(url, '_blank');
          modal.remove();
          showToast(service === 'copy'
            ? 'Prompt kopiert til utklippstavlen!'
            : 'Prompt kopiert! Lim inn med Ctrl+V i ' + serviceName + '-chatten.');
        }).catch(function() {
          var ta = document.createElement('textarea');
          ta.value = prompt;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
          if (service !== 'copy' && url) window.open(url, '_blank');
          modal.remove();
          showToast('Prompt kopiert! Lim inn med Ctrl+V.');
        });
      });
    }

    function showToast(msg) {
      var existing = document.getElementById('bildeal-toast');
      if (existing) existing.remove();
      var toast = document.createElement('div');
      toast.id = 'bildeal-toast';
      toast.textContent = msg;
      toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:12px 24px;border-radius:8px;font-size:0.9rem;font-weight:500;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,0.2)';
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 3500);
    }

    function formatKr(n) { return (n||0).toLocaleString('nb-NO')+' kr'; }
    function formatNum(n) { return (n||0).toLocaleString('nb-NO'); }
    function esc(s) { var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
  </script>
</body>
</html>
